name: hourly-funding-scan

on:
  schedule:
    - cron: "7 * * * *"   # hourly at :07 UTC (off the top-of-hour rush)
  workflow_dispatch:       # manual "Run workflow" button for testing

permissions:
  contents: write          # the job commits new CSV rows back to the repo

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scanner
        run: python scanner.py

      - name: Commit new rows
        run: |
          git config user.name  "funding-scanner-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && echo "no new data" && exit 0
          git commit -m "scan $(date -u +'%Y-%m-%dT%H:%M')Z"
          git pull --rebase origin main
          git push
